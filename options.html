<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube Link Launcher – Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input[type=text] { width: 100%; padding: 8px; box-sizing: border-box; font-family: monospace; }
    button { margin-top: 16px; padding: 8px 16px; }
    code { background: #eee; padding: 1px 4px; border-radius: 3px; }
    .hint { color: #555; font-size: 13px; margin-top: 6px; }
    #status { margin-left: 12px; color: green; }
  </style>
</head>
<body>
  <h1>YouTube Link Launcher</h1>
  <label><input type="checkbox" id="enabled"> Enabled</label>

  <label for="template">URL scheme template</label>
  <input type="text" id="template">
  <p class="hint">
    Placeholders: <code>{url}</code> (URL-encoded), <code>{rawurl}</code> (unencoded), <code>{id}</code> (video ID).<br>
    Examples: <code>ytplayer://open?url={url}</code>, <code>vlc://{rawurl}</code>, <code>myapp://play/{id}</code><br>
    Hold <strong>Alt</strong> while clicking to open a link normally.
  </p>

  <button id="save">Save</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
